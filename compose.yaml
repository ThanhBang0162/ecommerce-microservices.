name: ecommerce-microservices

services:
  auth-db:
    image: postgres:17
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_dev_password
      POSTGRES_DB: auth_db
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./database/auth:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  customer-db:
    image: postgres:17
    environment:
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: customer_dev_password
      POSTGRES_DB: customer_db
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - customer_db_data:/var/lib/postgresql/data
      - ./database/customer:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_user -d customer_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-db:
    image: postgres:17
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_dev_password
      POSTGRES_DB: order_db
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
      - ./database/order:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  product-db:
    image: mongo:8.0
    ports:
      - "127.0.0.1:17017:27017"
    volumes:
      - product_db_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  shipment-db:
    image: mongo:8.0
    ports:
      - "127.0.0.1:17018:27017"
    volumes:
      - shipment_db_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - OrderCreated
      - --partitions
      - "1"
      - --replication-factor
      - "1"

  auth-service:
    image: ecommerce-auth-service:dev
    build:
      context: .
      args:
        APP_PATH: services/auth-service
    environment:
      DATABASE_URL: postgresql://auth_user:auth_dev_password@auth-db:5432/auth_db
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50051"
      JWT_SECRET: "${AUTH_JWT_SECRET:?Thieu AUTH_JWT_SECRET trong .env goc}"
      JWT_EXPIRES_IN: 1h
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const g=require('@grpc/grpc-js');
          const l=require('@grpc/proto-loader');
          const p=g.loadPackageDefinition(l.loadSync('/app/proto/auth.proto')).auth;
          const c=new p.AuthService('127.0.0.1:50051',g.credentials.createInsecure());
          c.Health({},{deadline:new Date(Date.now()+4000)},(e,r)=>{
          c.close();process.exit(!e&&r.status==='UP'?0:1);});
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  customer-service:
    image: ecommerce-customer-service:dev
    build:
      context: .
      args:
        APP_PATH: services/customer-service
    environment:
      DATABASE_URL: postgresql://customer_user:customer_dev_password@customer-db:5432/customer_db
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50052"
    depends_on:
      customer-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const g=require('@grpc/grpc-js');
          const l=require('@grpc/proto-loader');
          const p=g.loadPackageDefinition(l.loadSync('/app/proto/customer.proto')).customer;
          const c=new p.CustomerService('127.0.0.1:50052',g.credentials.createInsecure());
          c.Health({},{deadline:new Date(Date.now()+4000)},(e,r)=>{
          c.close();process.exit(!e&&r.status==='UP'?0:1);});
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  product-service:
    image: ecommerce-product-service:dev
    build:
      context: .
      args:
        APP_PATH: services/product-service
    environment:
      MONGODB_URI: mongodb://product-db:27017/product_db
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50053"
    depends_on:
      product-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const g=require('@grpc/grpc-js');
          const l=require('@grpc/proto-loader');
          const p=g.loadPackageDefinition(l.loadSync('/app/proto/product.proto')).product;
          const c=new p.ProductService('127.0.0.1:50053',g.credentials.createInsecure());
          c.Health({},{deadline:new Date(Date.now()+4000)},(e,r)=>{
          c.close();process.exit(!e&&r.status==='UP'?0:1);});
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  order-service:
    image: ecommerce-order-service:dev
    build:
      context: .
      args:
        APP_PATH: services/order-service
    environment:
      DATABASE_URL: postgresql://order_user:order_dev_password@order-db:5432/order_db
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50054"
      CUSTOMER_GRPC_ADDRESS: customer-service:50052
      PRODUCT_GRPC_ADDRESS: product-service:50053
    depends_on:
      order-db:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const g=require('@grpc/grpc-js');
          const l=require('@grpc/proto-loader');
          const p=g.loadPackageDefinition(l.loadSync('/app/proto/order.proto')).order;
          const c=new p.OrderService('127.0.0.1:50054',g.credentials.createInsecure());
          c.Health({},{deadline:new Date(Date.now()+8000)},(e,r)=>{
          c.close();process.exit(!e&&r.status==='UP'?0:1);});
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  shipment-service:
    image: ecommerce-shipment-service:dev
    build:
      context: .
      args:
        APP_PATH: services/shipment-service
    environment:
      MONGODB_URI: mongodb://shipment-db:27017/shipment_db
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50055"
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: shipment-service
      KAFKA_GROUP_ID: shipment-service-group
      KAFKA_ORDER_TOPIC: OrderCreated
    depends_on:
      shipment-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const g=require('@grpc/grpc-js');
          const l=require('@grpc/proto-loader');
          const p=g.loadPackageDefinition(l.loadSync('/app/proto/shipment.proto')).shipment;
          const c=new p.ShipmentService('127.0.0.1:50055',g.credentials.createInsecure());
          c.Health({},{deadline:new Date(Date.now()+4000)},(e,r)=>{
          c.close();process.exit(!e&&r.status==='UP'?0:1);});
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  outbox-worker:
    image: ecommerce-order-service:dev
    command: ["node", "src/outboxWorker.js"]
    environment:
      DATABASE_URL: postgresql://order_user:order_dev_password@order-db:5432/order_db
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: order-outbox-worker
      KAFKA_ORDER_TOPIC: OrderCreated
    depends_on:
      order-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s

  provisioning-worker:
    image: ecommerce-auth-service:dev
    command: ["node", "src/customerProvisioningWorker.js"]
    environment:
      DATABASE_URL: postgresql://auth_user:auth_dev_password@auth-db:5432/auth_db
      CUSTOMER_GRPC_ADDRESS: customer-service:50052
    depends_on:
      auth-db:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  api-gateway:
    image: ecommerce-api-gateway:dev
    build:
      context: .
      args:
        APP_PATH: api-gateway
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      AUTH_GRPC_ADDRESS: auth-service:50051
      CUSTOMER_GRPC_ADDRESS: customer-service:50052
      PRODUCT_GRPC_ADDRESS: product-service:50053
      ORDER_GRPC_ADDRESS: order-service:50054
      SHIPMENT_GRPC_ADDRESS: shipment-service:50055
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      auth-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('node:http');
          const q=http.get('http://127.0.0.1:3002/api/health',r=>{
          r.resume();process.exit(r.statusCode===200?0:1);});
          q.setTimeout(12000,()=>{q.destroy();process.exit(1);});
          q.on('error',()=>process.exit(1));
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 20s

volumes:
  auth_db_data:
  customer_db_data:
  order_db_data:
  product_db_data:
  shipment_db_data:
  kafka_data: